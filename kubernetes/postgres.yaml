---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app: postgres
  namespace: netshot
spec:
  replicas: 1
  serviceName: netshot-postgres-pvc
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      imagePullSecrets:
        - name: <registry_secret>
      containers:
      - name: postgres
        image: postgres:10
        ports:
        - containerPort: 5432
        volumeMounts:
          - mountPath: /var/lib/postgresql/data
            name: postgres-data
          - mountPath: /etc/postgres/secrets
            name: postgres-secrets
            readOnly: true
        # Secrets are mounted as files, and referenced through the *_FILE variables
        env:
          - name: POSTGRES_PASSWORD_FILE
            value: /etc/postgres/secrets/password
          - name: POSTGRES_USER_FILE
            value: /etc/postgres/secrets/user
          - name: PGDATA
            value: /var/lib/postgresql/data/pgdata
      volumes:
        - name: postgres-secrets
          projected:
            # Read by the postgres user (not root) in the container
            defaultMode: 0444
            sources:
              - secret:
                  name: pgpassword
                  items:
                    - key: POSTGRES_PASSWORD
                      path: password
              - secret:
                  name: postgresuser
                  items:
                    - key: POSTGRES_USER
                      path: user

  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: <storage_class_name>
      resources:
        requests:
          storage: 200Gi

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
  namespace: netshot
spec:
  ports:
  - name: netshot
    port: 5432
    targetPort: 5432
  selector:
    app: postgres
  type: ClusterIP
