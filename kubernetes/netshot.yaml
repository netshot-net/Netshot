---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netshot
  labels:
    app: netshot
  namespace: netshot
spec:
  selector:
    matchLabels:
      app: netshot
  template:
    metadata:
      labels:
        app: netshot
    spec:
      imagePullSecrets:
        - name: <registry_secret>
      containers:
      - name: netshot
        image: <imageLocation>/netshot:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        # Secrets are mounted as files (not passed as environment variables, which would be
        # visible to user scripts) and referenced through the *_FILE variables
        env:
          - name: NETSHOT_DB_PASSWORD_FILE
            value: /etc/netshot/secrets/db-password
          - name: NETSHOT_DB_USERNAME_FILE
            value: /etc/netshot/secrets/db-username
          - name: NETSHOT_DB_ENCRYPTIONPASSWORD_FILE
            value: /etc/netshot/secrets/db-encryption-password
          - name: NETSHOT_DB_URL
            value: 'jdbc:postgresql://postgres/netshot' #this assumes your using postgres
          # Uncomment if Netshot is accessed over HTTPS (e.g. TLS terminated by the ingress)
          # - name: NETSHOT_HTTP_SECURECOOKIE
          #   value: "true"
        volumeMounts:
          - name: netshot-secrets
            mountPath: /etc/netshot/secrets
            readOnly: true
      volumes:
        - name: netshot-secrets
          projected:
            defaultMode: 0400
            sources:
              - secret:
                  name: dbpass
                  items:
                    - key: SECRET_KEY
                      path: db-password
              - secret:
                  name: dbuser
                  items:
                    - key: SECRET_KEY
                      path: db-username
              # Key used to encrypt the device credentials in the DB. Keep a backup of it.
              # Required: Netshot won't start without it. If Netshot was previously deployed without it,
              # the key built into the image ('netshot') was used: set SECRET_KEY to netshot to keep
              # the stored credentials readable.
              - secret:
                  name: dbencryption
                  items:
                    - key: SECRET_KEY
                      path: db-encryption-password

---
apiVersion: v1
kind: Service
metadata:
  name: netshot
  labels:
    app: netshot
  namespace: netshot
spec:
  ports:
  - name: netshot
    port: 80
    targetPort: 8080
  selector:
    app: netshot
  type: ClusterIP
