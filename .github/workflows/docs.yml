name: Documentation

on:
  push:
    branches:
      - master
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  deploy-dev:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - run: uv sync --project docs --locked

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy bleeding-edge docs
        run: uv run --project docs mike deploy --push dev

      - name: Bootstrap a default version if none exists yet
        # Until the first GitHub Release is published, deploy-release below never runs,
        # so mike never sets a default and the site root 404s. Fall back to "dev" as the
        # default so the root resolves; once a release sets "latest" as default, the root
        # index.html this creates gets overwritten and this step becomes a permanent no-op.
        run: |
          git fetch origin gh-pages
          if ! git cat-file -e origin/gh-pages:index.html 2>/dev/null; then
            uv run --project docs mike set-default --push dev
          fi

  deploy-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - run: uv sync --project docs --locked

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy release docs and update latest alias
        run: |
          uv run --project docs mike deploy --push --update-aliases "${{ github.event.release.tag_name }}" latest
          uv run --project docs mike set-default --push latest
