name: Build and publish Docker and zip archive

on:
  push:
    branches:
      - master
  release:
    types:
      - published

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build_and_upload:
    name: Build, test and upload the files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Log in to the Container registry
        uses: docker/login-action@v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=Netshot
            org.opencontainers.image.description=Network Configuration and Compliance Management Software
            org.opencontainers.image.vendor=Netshot
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Prepare the WebUI builder
        uses: docker/build-push-action@v6
        with:
          context: .
          target: webui-builder
          tags: webui-builder

      - name: Lint the WebUI
        run: docker run --rm webui-builder npm run lint

      - name: Type-check the WebUI
        # Regenerate the Chakra UI typings first so the check reflects the project's actual
        # theme (custom tokens/recipes), not the generic defaults shipped in node_modules,
        # then verify typegen didn't leave anything out of sync with what's committed - i.e.
        # that the developer regenerated (and committed) the typings themselves. Currently
        # typegen only patches .d.ts files inside node_modules (not part of the repo), so the
        # diff is a no-op guard today, but it'll start mattering if that ever changes.
        run: |
          docker run --name webui-types webui-builder sh -c "npm run chakra:typegen && npm run tsx"
          docker cp webui-types:/build/webui/src src/main/resources/webui
          docker rm webui-types
          git diff --exit-code -- src/main/resources/webui

      - name: Prepare the builder
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          tags: builder
          build-args: |
            NETSHOT_VERSION=${{ steps.meta.outputs.version }}

      - name: Check the style
        run: docker run --rm builder ./mvnw checkstyle:check

      - name: Run the tests
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock builder ./mvnw test

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NETSHOT_VERSION=${{ steps.meta.outputs.version }}

      - name: Extract Netshot JAR
        uses: shrink/actions-docker-extract@v3
        id: extract
        with:
          image: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          path: /usr/local/netshot/netshot.jar

      - name: Prepare ZIP archive
        run: |
          mkdir zip
          cd zip
          cp ../dist/* .
          cp ../${{ steps.extract.outputs.destination }}/netshot.jar .
          echo ${{ steps.meta.outputs.version }} > VERSION.txt
          zip netshot_${{ steps.meta.outputs.version }}.zip *

      - name: Upload the ZIP archive
        uses: actions/upload-artifact@v4
        with:
          name: netshot-dist
          path: zip/netshot_${{ steps.meta.outputs.version }}.zip


  attach_to_release:
    name: Attach archive to GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: build_and_upload
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: netshot-dist
      - name: Upload to release
        uses: svenstaro/upload-release-action@v2
        with:
          file: "*.zip"
          file_glob: true
