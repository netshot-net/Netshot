    "/configs": {
      "get": {
        "description": "Retrieves a list of configurations, based on given criteria.",
        "operationId": "getConfigs",
        "parameters": [
          {
            "description": "Configs gathered after this date (as milliseconds since 1970)",
            "in": "query",
            "name": "after",
            "schema": {
              "format": "int64",
              "type": "integer"
            }
          },
          {
            "description": "Configs gathered before this date (as milliseconds since 1970)",
            "in": "query",
            "name": "before",
            "schema": {
              "format": "int64",
              "type": "integer"
            }
          },
          {
            "description": "Filter on given domain ID(s)",
            "in": "query",
            "name": "domain",
            "schema": {
              "items": {
                "format": "int64",
                "type": "integer"
              },
              "type": "array",
              "uniqueItems": true
            }
          },
          {
            "description": "Filter on given group ID(s)",
            "in": "query",
            "name": "group",
            "schema": {
              "items": {
                "format": "int64",
                "type": "integer"
              },
              "type": "array",
              "uniqueItems": true
            }
          },
          {
            "description": "Pagination offset for the first item to return",
            "in": "query",
            "name": "offset",
            "schema": {
              "format": "int32",
              "type": "integer"
            }
          },
          {
            "description": "Maximum number of items to return",
            "in": "query",
            "name": "limit",
            "schema": {
              "format": "int32",
              "type": "integer"
            }
          }
        ],
        "responses": {
          "default": {
            "content": {
              "application/json": { },
              "application/xml": { }
            },
            "description": "default response"
          }
        },
