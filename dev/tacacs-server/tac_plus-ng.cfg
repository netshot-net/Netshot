#!/usr/local/sbin/tac_plus-ng
# Test configuration: the Netshot users of each role, shared key "netshot-tacacs-key"

id = spawnd {
	background = no
	listen { port = 49 }
	spawn {
		instances min = 1
		instances max = 4
	}
}

id = tac_plus-ng {
	log stderrlog { destination = ">/dev/stderr" }
	log acctlog {
		destination = /tmp/accounting.log
		accounting format = "${user}${FS}${accttype}${FS}${args,|}\n"
	}
	access log = stderrlog
	authorization log = stderrlog
	accounting log = acctlog

	device world {
		address = 0.0.0.0/0
		address = ::/0
		key = netshot-tacacs-key
	}

	profile netshot-admin {
		script {
			if (service == netshot-rest) {
				set role = admin
				permit
			}
		}
	}

	profile netshot-operator {
		script {
			if (service == netshot-rest) {
				set role = operator
				permit
			}
		}
	}

	profile netshot-custom {
		script {
			if (service == netshot-rest) {
				set role = netshot-superuser
				permit
			}
		}
	}

	profile netshot-norole {
		script {
			if (service == netshot-rest) {
				permit
			}
		}
	}

	profile netshot-denied {
		script {
			deny
		}
	}

	user admin {
		password login = clear AdminPass1
		profile = netshot-admin
	}

	user operator {
		password login = clear OperatorPass1
		profile = netshot-operator
	}

	user custom {
		password login = clear CustomPass1
		profile = netshot-custom
	}

	user norole {
		password login = clear NoRolePass1
		profile = netshot-norole
	}

	user denied {
		password login = clear DeniedPass1
		profile = netshot-denied
	}
}
