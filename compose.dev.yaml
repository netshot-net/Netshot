name: netshot-dev

services:
  netshot:
    extends:
      file: dist/compose.yaml
      service: netshot
    pull_policy: never
    build: .
    networks:
      - devices

  webui:
    build:
      context: .
      dockerfile_inline: |
        FROM node:24
        VOLUME [ "/app" ]
        WORKDIR /app
        ENV PATH /app/node_modules/.bin:$PATH
        EXPOSE 3000
        CMD [ "/bin/bash", "-c", "npm i; npm run dev" ]
    environment:
      PROXY_URL: http://netshot:8080
      VITE_API_URL: http://netshot:8080
    labels:
      traefik.docker.network: ${COMPOSE_PROJECT_NAME}_front
      traefik.http.routers.webui-https.rule: "PathPrefix(`/`)"
      traefik.http.routers.webui-https.tls: true
      traefik.http.routers.webui-https.entrypoints: "web-secure"
      traefik.http.routers.webui-https.priority: 10000
      traefik.http.services.webui.loadbalancer.server.port: "3000"
    volumes:
      - "./src/main/resources/webui:/app"
    networks:
      - front

  rproxy:
    extends:
      file: dist/compose.yaml
      service: rproxy
    ports: !override
      - "8443:443"

  database:
    extends:
      file: dist/compose.yaml
      service: database
    
  router1:
    build: ./dev/device-simulator
    environment:
      NETSHOT_SIMULATOR_DRIVER: Cisco_IOS
      NETSHOT_SIMULATOR_NAME: router1
    networks:
      - devices

  router2:
    build: ./dev/device-simulator
    environment:
      NETSHOT_SIMULATOR_DRIVER: Juniper_Junos
      NETSHOT_SIMULATOR_NAME: router2
    networks:
      - front

volumes:
  dbdata:
  binarydata:

networks:
  front:
  database:
  devices:
